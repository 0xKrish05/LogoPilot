version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      default:
        aliases:
          - logopilot-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - media_temp:/tmp/media
      - media_assets:/data/assets
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.logopilot-api.rule=Host(`api.15-135-74-108.sslip.io`)
      - traefik.http.routers.logopilot-api.entrypoints=https
      - traefik.http.routers.logopilot-api.tls=true
      - traefik.http.routers.logopilot-api.tls.certresolver=letsencrypt
      - traefik.http.services.logopilot-api.loadbalancer.server.port=8000
      - traefik.http.routers.logopilot-api-http.rule=Host(`api.15-135-74-108.sslip.io`)
      - traefik.http.routers.logopilot-api-http.entrypoints=http
      - traefik.http.routers.logopilot-api-http.middlewares=logopilot-api-redirect
      - traefik.http.middlewares.logopilot-api-redirect.redirectscheme.scheme=https

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - backend
    volumes:
      - media_temp:/tmp/media
      - media_assets:/data/assets

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_FIREBASE_CONFIG: ${NEXT_PUBLIC_FIREBASE_CONFIG:-}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.logopilot-app.rule=Host(`app.15-135-74-108.sslip.io`)
      - traefik.http.routers.logopilot-app.entrypoints=https
      - traefik.http.routers.logopilot-app.tls=true
      - traefik.http.routers.logopilot-app.tls.certresolver=letsencrypt
      - traefik.http.services.logopilot-app.loadbalancer.server.port=3000
      - traefik.http.routers.logopilot-app-http.rule=Host(`app.15-135-74-108.sslip.io`)
      - traefik.http.routers.logopilot-app-http.entrypoints=http
      - traefik.http.routers.logopilot-app-http.middlewares=logopilot-app-redirect
      - traefik.http.middlewares.logopilot-app-redirect.redirectscheme.scheme=https

networks:
  coolify:
    external: true

volumes:
  postgres_data:
  media_temp:
  media_assets:
